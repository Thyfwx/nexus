name: Deploy Cloudflare Worker

# Runs on every push to main. Bumps wrangler.toml's NEXUS_VERSION inline
# from the canonical source in nexus_globals.js, then deploys via wrangler.
#
# Security: no github.event.* untrusted strings reach any run: command. Only
# repo secrets (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) flow in.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy nexus-api Worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'

      - name: Verify Cloudflare secrets are configured
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -e
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          if [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set. Add it under Settings → Secrets and variables → Actions → Repository secrets."
            exit 1
          fi
          echo "Both Cloudflare secrets are present."

      - name: Sync NEXUS_VERSION in wrangler.toml from nexus_globals.js
        run: |
          set -eo pipefail
          VER="$(grep -oE "window\.NEXUS_VERSION\s*=\s*'v[0-9]+\.[0-9]+\.[0-9]+'" web_nexus/static/nexus_globals.js | head -n 1 | grep -oE "v[0-9]+\.[0-9]+\.[0-9]+")"
          if [ -z "$VER" ]; then
            echo "::error file=web_nexus/static/nexus_globals.js::Could not parse window.NEXUS_VERSION (expected e.g. v1.2.3)"
            exit 1
          fi
          echo "Detected NEXUS_VERSION: $VER"
          # Replace the NEXUS_VERSION line in worker/wrangler.toml in place.
          # Uses portable sed (works on GNU and BSD sed).
          sed -i.bak "s|^NEXUS_VERSION = \".*\"|NEXUS_VERSION = \"$VER\"|" worker/wrangler.toml
          rm -f worker/wrangler.toml.bak
          echo "wrangler.toml after sync:"
          grep NEXUS_VERSION worker/wrangler.toml

      - name: Deploy Worker via wrangler
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
