version: 2
updates:
  # Backend is a Cloudflare Worker (npm). The old Python/pip backend was
  # decommissioned, so there is no pip manifest left to watch.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
