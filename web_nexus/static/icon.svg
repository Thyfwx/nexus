<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="THYFWX terminal icon">
  <title>Xavier Scott — Systems Specialist</title>

  <!-- Dark rounded square background, same tone as the portfolio favicon. -->
  <rect width="512" height="512" rx="100" fill="#1a1a1a"/>

  <!-- Subtle scanline texture: very low opacity horizontal lines for character. -->
  <g opacity="0.06" fill="#ff00ff">
    <rect x="0" y="140" width="512" height="3"/>
    <rect x="0" y="220" width="512" height="3"/>
    <rect x="0" y="300" width="512" height="3"/>
    <rect x="0" y="380" width="512" height="3"/>
  </g>

  <!-- The magenta &gt;_ glyph: chevron + underscore. Same brand mark as
       the portfolio favicon, rendered larger and crisper for app icons. -->
  <path d="M 130 160 L 250 256 L 130 352"
        fill="none" stroke="#ff00ff" stroke-width="48"
        stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <rect x="282" y="316" width="140" height="40" rx="8" fill="#ff00ff" filter="url(#glow)"/>

  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
